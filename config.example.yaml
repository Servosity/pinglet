# Pinglet Configuration
# Copy this file to config.yaml and customize for your setup

slack:
  token_env: SLACK_USER_TOKEN       # Environment variable name
  default_channel: DXXXXXXXXXX      # Your Slack DM channel ID

notifications:
  on_success: false                 # Silent on success
  on_failure: true                  # Always alert on failure
  slack_enabled: true
  macos_enabled: true
  success_silent: true              # Success notifications are silent (no sound/banner)
  manual_complete_silent: true      # Manual run completion notifications are silent

# Reliability system - reduces alert fatigue by handling transient failures
reliability:
  retry:
    max_attempts: 3                 # Total attempts per run
    delays_seconds: [10, 60, 300]   # 10s, 1min, 5min backoff
    jitter: 0.25                    # +/-25% randomization
  alert:
    consecutive_failures: 3         # Default: alert after 3 consecutive failures
    cooldown_minutes: 30            # Don't re-alert within this period
  notify_on_recovery: true          # Send "Recovered" notification

# Heartbeat system - detects missed tasks
heartbeat:
  enabled: true
  interval_minutes: 60              # How often heartbeat runs (LaunchAgent)
  wake_delay_seconds: 30            # Delay before notifying after detecting gaps

healthcheck:
  enabled: true
  schedule_hour: 20                 # 8 PM
  expected_intervals:               # Hours - alert if task hasn't run
    my-task: 2                      # Example: alert if not run within 2 hours

agent_runners:
  # Slot order is fixed: primary, secondary, tertiary.
  # Fallback happens after 3 consecutive provider failures for the same callback.
  primary:
    provider: codex
    subscription: openai
    model: gpt-5.5
    command: codex
  secondary:
    provider: claude
    subscription: claude
    model: sonnet-4.6
    fallback_model: sonnet-5
    command: claude
  tertiary:
    enabled: false
    provider: openrouter
    subscription: openrouter
    model: qwen/qwen3-coder
    api_key_env: OPENROUTER_API_KEY

# Task definitions
# Each task needs: command, working_dir, and optionally args, timeout, env, output, reliability
tasks:
  # Example task with basic configuration
  my-task:
    name: My Task Name              # Display name for notifications
    command: uv
    args:
      - run
      - python
      - script.py
      - --flag
    working_dir: /path/to/project
    timeout: 300                    # 5 minutes
    env:
      - SOME_ENV_VAR                # Pass through from parent environment
    output:
      format: text                  # "text" or "json"
    reliability:
      alert:
        consecutive_failures: 3     # Override global default

  # Example task with JSON output formatting
  json-output-task:
    name: JSON Output Example
    command: uv
    args:
      - run
      - python
      - script.py
    working_dir: /path/to/project
    timeout: 300
    output:
      format: json
      summary_template: "Processed {count} items, {errors} errors"
    reliability:
      alert:
        consecutive_failures: 2

  # Example task with on_failure LLM auto-diagnosis
  # When the task fails the alert threshold, Pinglet invokes the configured
  # CLI runner. The callback should fix the root cause and exit 0, or
  # exit 1 to escalate to a human. Without on_failure, alerts show
  # "LLM Troubleshooter: Not configured — human intervention required".
  #
  # Template variables: {task_id}, {task_name}, {exit_code}, {error},
  # {log_file}, {stderr_file}, {stdout_file}, {working_dir},
  # {consecutive_failures}, {state_file}, {project_root}, {learning_file}
  self-healing-task:
    name: Self-Healing Example
    command: uv
    args:
      - run
      - python
      - script.py
    working_dir: /path/to/project
    timeout: 300
    schedule: every 1h
    on_failure:
      command: codex
      args:
        - "-p"
        - "Task {task_id} failed (exit {exit_code}). Read {stderr_file} and {log_file}. Check {learning_file} for prior diagnoses of this task. Investigate the working directory {working_dir} for the root cause. Fix it if possible. Exit 0 if fixed, exit 1 if human intervention is needed."
      timeout: 180             # Wall-clock budget for the callback
      max_turns: 5             # Cap CLI agent turns
      max_budget_usd: 2.00     # Cap spend per invocation
