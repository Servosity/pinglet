# Pinglet Configuration

slack:
  token_env: SLACK_USER_TOKEN       # Environment variable name
  default_channel: DXXXXXXXXXX        # Damien's DM channel

notifications:
  on_success: false                 # Silent on success
  on_failure: true                  # Always alert on failure
  slack_enabled: true
  macos_enabled: true

# Reliability system - reduces alert fatigue by handling transient failures
reliability:
  retry:
    max_attempts: 3                 # Total attempts per run
    delays_seconds: [10, 60, 300]   # 10s, 1min, 5min backoff
    jitter: 0.25                    # ±25% randomization
  alert:
    consecutive_failures: 3         # Default: alert after 3 consecutive failures
    cooldown_minutes: 30            # Don't re-alert within this period
  notify_on_recovery: true          # Send "Recovered" notification

healthcheck:
  enabled: true
  schedule_hour: 20                 # 8 PM (after UCE evening run)
  expected_intervals:               # Hours - alert if task hasn't run
    uce: 14                         # UCE runs every 12h, allow 14h grace
    git-sync: 2                     # Git-sync runs hourly, allow 2h grace
    claude-backup: 2                # Claude backup runs hourly, allow 2h grace

tasks:
  uce:
    name: UCE Link Collector
    command: /path/to/uce/venv/bin/python
    args:
      - runner.py
    working_dir: /path/to/uce
    timeout: 600                    # 10 minutes
    env:
      - SLACK_USER_TOKEN            # Pass through from parent env
    reliability:
      alert:
        consecutive_failures: 3     # Runs 2x daily; 3 failures = 36hr worst case

  git-sync:
    name: Obsidian Git-Sync
    command: /path/to/git-sync/venv/bin/python3
    args:
      - sync.py
      - config.yaml
    working_dir: /path/to/git-sync
    timeout: 120                    # 2 minutes
    reliability:
      alert:
        consecutive_failures: 5     # Hourly; git conflicts common; 5hr tolerance

  claude-backup:
    name: Claude Code Backup
    command: /path/to/claude-backup/venv/bin/python
    args:
      - -m
      - claude_backup
      - --robot
      - snapshot
      - --auto
    working_dir: /path/to/claude-backup
    timeout: 300                    # 5 minutes
    reliability:
      alert:
        consecutive_failures: 5     # Hourly; important but not urgent; 5hr tolerance

  # Future tasks can be added here:
  # home-repo:
  #   name: Home Repo Sync
  #   command: /path/to/venv/bin/python
  #   args: [sync.py]
  #   working_dir: /path/to/home-repo
  #   timeout: 60
